<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar Pet - PetVida</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body>

    <h1>✏️ Editar Pet</h1>

    <form
        action="/atualizar_pet/{{ pet['id'] }}"
        method="POST"
    >

        <label>
            Nome:
        </label>

        <br>

        <input
            type="text"
            name="nome"
            value="{{ pet['nome'] }}"
            required
        >

        <br><br>


        <label>
            Espécie:
        </label>

        <br>

        <select name="especie" required>

            <option
                value="Cachorro"
                {% if pet['especie'] == 'Cachorro' %}
                selected
                {% endif %}
            >
                Cachorro
            </option>

            <option
                value="Gato"
                {% if pet['especie'] == 'Gato' %}
                selected
                {% endif %}
            >
                Gato
            </option>

            <option
                value="Outro"
                {% if pet['especie'] == 'Outro' %}
                selected
                {% endif %}
            >
                Outro
            </option>

        </select>

        <br><br>


        <label>
            Raça:
        </label>

        <br>

        <input
            type="text"
            name="raca"
            value="{{ pet['raca'] or '' }}"
        >

        <br><br>


        <label>
            Idade:
        </label>

        <br>

        <input
            type="number"
            name="idade"
            min="0"
            max="100"
            value="{{ pet['idade'] }}"
            required
        >

        <br><br>


        <button type="submit">
            💾 Salvar alterações
        </button>

    </form>

    <br>

    <a href="/">
        Cancelar
    </a>

</body>

</html>
