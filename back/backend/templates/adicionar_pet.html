{% extends "base.html" %}

{% block titulo %}Adicionar pet{% endblock %}

{% block conteudo %}

<div class="cabecalho-pagina">
    <h1>🐾 Adicionar pet</h1>
    <p>Preencha os dados do seu companheiro.</p>
</div>

<form class="form-card" action="{{ url_for('salvar_pet') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="campo">
        <label for="nome">Nome</label>
        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex.: Thor"
            maxlength="60"
            required
        >
    </div>

    <div class="linha-campos">
        <div class="campo">
            <label for="especie">Espécie</label>
            <select id="especie" name="especie" required>
                <option value="">Selecione</option>
                {% for especie in especies %}
                    <option value="{{ especie }}">
                        {{ especie|emoji_pet }} {{ especie }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="idade">Idade (anos)</label>
            <input
                type="number"
                id="idade"
                name="idade"
                min="0"
                max="100"
                placeholder="Ex.: 3"
                required
            >
        </div>
    </div>

    <div class="campo">
        <label for="raca">Raça <small>(opcional)</small></label>
        <input
            type="text"
            id="raca"
            name="raca"
            placeholder="Ex.: Labrador"
            maxlength="60"
        >
    </div>

    <div class="acoes">
        <button type="submit" class="btn">Cadastrar pet</button>
        <a class="btn btn-secundario" href="{{ url_for('inicio') }}">Cancelar</a>
    </div>
</form>

{% endblock %}
