{% extends "base.html" %}

{% block titulo %}Editar pet{% endblock %}

{% block conteudo %}

<div class="cabecalho-pagina">
    <h1>✏️ Editar {{ pet['nome'] }}</h1>
    <p>Atualize os dados do seu pet.</p>
</div>

<form
    class="form-card"
    action="{{ url_for('atualizar_pet', pet_id=pet['id']) }}"
    method="POST"
>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="campo">
        <label for="nome">Nome</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ pet['nome'] }}"
            maxlength="60"
            required
        >
    </div>

    <div class="linha-campos">
        <div class="campo">
            <label for="especie">Espécie</label>
            <select id="especie" name="especie" required>
                {% for especie in especies %}
                    <option
                        value="{{ especie }}"
                        {{ 'selected' if pet['especie'] == especie }}
                    >
                        {{ especie|emoji_pet }} {{ especie }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="idade">Idade (anos)</label>
            <input
                type="number"
                id="idade"
                name="idade"
                min="0"
                max="100"
                value="{{ pet['idade'] if pet['idade'] is not none else '' }}"
                required
            >
        </div>
    </div>

    <div class="campo">
        <label for="raca">Raça <small>(opcional)</small></label>
        <input
            type="text"
            id="raca"
            name="raca"
            value="{{ pet['raca'] or '' }}"
            maxlength="60"
        >
    </div>

    <div class="acoes">
        <button type="submit" class="btn">💾 Salvar alterações</button>
        <a class="btn btn-secundario" href="{{ url_for('inicio') }}">Cancelar</a>
    </div>
</form>

{% endblock %}
